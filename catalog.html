<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070C16">
<title>Колонисты Парадайза</title>
<link rel="stylesheet" href="fonts/badge-fonts.css">
<style>
  @font-face { font-family: 'Robtronika'; src: url('fonts/Robtronika-4Bq8p.woff') format('woff'); font-display: swap; }
  :root {
    --bg: #070C16; --bg2: #0C1424; --card: #101A2D; --line: rgba(148, 178, 214, .16);
    --ink: #EAF2FB; --ink2: #A9BCD3; --ink3: #6F86A3; --cyan: #5EEAD4;
    --m-pirveli: #D8802C; --m-paradise: #4C93D3; --m-paradise-2: #C39A3F; --m-freedom: #E5393E; --m-redemption: #F4C936;
    --font: 'Sofia Sans Condensed', 'Arial Narrow', system-ui, sans-serif;
    --font-head: 'Oswald', 'Arial Narrow', sans-serif;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-padding-top: 170px; }
  html, body { overflow-x: clip; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.4;
    background-image: radial-gradient(120% 60% at 50% -10%, rgba(76, 147, 211, .16), transparent 60%),
                      radial-gradient(80% 40% at 100% 100%, rgba(94, 234, 212, .06), transparent 60%);
    background-attachment: fixed; min-height: 100vh;
  }
  button, input { font: inherit; color: inherit; }
  img { display: block; }

  /* ---------- шапка ---------- */
  header { padding: 18px 16px 6px; max-width: 1100px; margin: 0 auto; }
  .brand { display: flex; flex-direction: column-reverse; gap: 8px; }
  .brand h1 { margin: 0; min-width: 0; font-family: 'Robtronika', var(--font-head); font-weight: 400; font-size: clamp(19px, 5.6vw, 34px); letter-spacing: 1.5px; line-height: 1.05; }
  .brand .era { font-family: var(--font-head); font-size: 12px; letter-spacing: 2px; color: var(--ink3); }
  .brand .era b { color: var(--cyan); font-weight: 500; }
  .sub { color: var(--ink2); font-size: 15px; margin: 6px 0 12px; }
  .docs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .doc-btn {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; cursor: pointer; text-align: left;
    background: linear-gradient(160deg, rgba(94, 234, 212, .10), rgba(94, 234, 212, .02)); border: 1px solid rgba(94, 234, 212, .28);
  }
  .doc-btn svg { flex: none; width: 22px; height: 22px; stroke: var(--cyan); fill: none; stroke-width: 1.8; }
  .doc-btn b { display: block; font-family: var(--font-head); font-weight: 600; font-size: 16px; letter-spacing: 1px; text-transform: uppercase; }
  .doc-btn span { display: block; color: var(--ink3); font-size: 13px; line-height: 1.2; }

  /* ---------- поиск и модули (липкая панель) ---------- */
  .bar { position: sticky; top: 0; z-index: 10; padding: 10px 16px 8px; background: rgba(7, 12, 22, .9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .bar-in { max-width: 1100px; margin: 0 auto; }
  .search { position: relative; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: var(--ink3); fill: none; stroke-width: 2; }
  .search input { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg2); padding: 0 40px 0 38px; font-size: 17px; outline: none; }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  .search input:focus { border-color: rgba(94, 234, 212, .55); }
  .search .clear { position: absolute; right: 4px; top: 4px; width: 36px; height: 36px; border: 0; background: none; color: var(--ink3); font-size: 20px; cursor: pointer; display: none; }
  .search.has .clear { display: block; }
  .chips { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr); gap: 8px; padding: 10px 0 2px; }
  .chip { min-width: 0; height: 40px; padding: 0 10px 0 5px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg2); color: var(--ink2); font-family: var(--font-head); font-size: 14px; letter-spacing: .6px; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; gap: 8px; text-align: left; }
  .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .ci { flex: none; width: 30px; height: 30px; border-radius: 7px; background: var(--c, var(--cyan)); display: grid; place-items: center; }
  .chip .ci svg { width: 18px; height: 18px; }
  .chip.all { grid-row: span 2; height: auto; flex-direction: column; justify-content: center; gap: 4px; padding: 0 12px; }
  .chip.all .ci { background: rgba(94, 234, 212, .16); }
  .chip.all .ci svg { stroke: var(--cyan); fill: none; stroke-width: 2; }
  .chip.on { color: var(--ink); background: color-mix(in srgb, var(--c, var(--cyan)) 22%, var(--bg2)); border-color: var(--c, var(--cyan)); }
  @media (max-width: 380px) { .chip { font-size: 12.5px; letter-spacing: .3px; gap: 6px; padding-right: 6px; } .chip .ci { width: 26px; height: 26px; } .chip .ci svg { width: 16px; height: 16px; } .chip.all { padding: 0 8px; } }
  .chip.all.on .ci { background: var(--cyan); } .chip.all.on .ci svg { stroke: #06101C; }

  /* ---------- модули ---------- */
  main { max-width: 1100px; margin: 0 auto; padding: 8px 16px calc(40px + var(--safe-b)); }
  .mod { margin-top: 22px; }
  .mod-head { display: flex; align-items: center; gap: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--c); }
  .mod-ico { width: 38px; height: 38px; border-radius: 10px; background: var(--c); display: grid; place-items: center; flex: none; }
  .mod-ico svg { width: 22px; height: 22px; }
  .mod-title { flex: 1; min-width: 0; }
  .mod-title h2 { margin: 0; font-family: var(--font-head); font-weight: 600; font-size: 24px; letter-spacing: 2px; text-transform: uppercase; line-height: 1.1; }
  .mod-title span { color: var(--ink3); font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
  .mod-more { border: 1px solid var(--line); background: none; border-radius: 10px; height: 34px; padding: 0 10px; color: var(--ink2); font-size: 14px; cursor: pointer; white-space: nowrap; }
  .mod-desc { color: var(--ink2); font-size: 16px; margin: 10px 0 0; display: none; }
  .mod.open .mod-desc { display: block; }

  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width: 860px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .card { position: relative; border-radius: 14px; overflow: hidden; background: var(--card); border: 1px solid var(--line); cursor: pointer; text-align: left; padding: 0; display: flex; flex-direction: column; transition: transform .15s ease, border-color .15s ease; }
  .card:active { transform: scale(.98); }
  @media (hover: hover) { .card:hover { border-color: var(--c); } }
  .ph { position: relative; aspect-ratio: 4 / 5; background: linear-gradient(160deg, #1A263B, #0C1424); overflow: hidden; }
  .ph img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; }
  .ph .none { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-head); font-size: 44px; color: rgba(255, 255, 255, .18); }
  .ph::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 60%, rgba(7, 12, 22, .65)); }
  .card .strip { height: 3px; background: var(--c); }
  .card .tx { padding: 9px 10px 12px; }
  .card .first { font-size: 12px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: var(--c); line-height: 1.2; }
  .card .last { font-family: var(--font-head); font-weight: 600; font-size: 20px; line-height: 1.1; text-transform: uppercase; letter-spacing: .5px; overflow-wrap: anywhere; }
  .card .tag { margin-top: 5px; color: var(--ink2); font-size: 14px; line-height: 1.25; }
  mark { background: rgba(94, 234, 212, .3); color: inherit; border-radius: 3px; }

  .empty { text-align: center; color: var(--ink3); padding: 40px 10px; }
  .err { margin: 24px 0; padding: 14px; border-radius: 12px; border: 1px solid rgba(229, 57, 62, .5); background: rgba(229, 57, 62, .08); color: #FFC9CB; }
  .skel { aspect-ratio: 4 / 6.3; border-radius: 14px; background: linear-gradient(100deg, var(--card) 40%, #16233A 50%, var(--card) 60%); background-size: 200% 100%; animation: sk 1.2s linear infinite; }
  @keyframes sk { to { background-position: -200% 0; } }

  /* ---------- карточка персонажа (лист снизу) ---------- */
  .veil { position: fixed; inset: 0; z-index: 50; background: rgba(2, 5, 10, .7); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .veil.on { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; z-index: 51; left: 0; right: 0; bottom: 0; max-height: 92vh; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain;
    background: var(--bg2); border-radius: 20px 20px 0 0; border-top: 3px solid var(--c, var(--cyan));
    transform: translateY(105%); transition: transform .28s cubic-bezier(.2, .8, .2, 1); padding-bottom: calc(24px + var(--safe-b));
  }
  .sheet.on { transform: none; }
  @media (min-width: 760px) {
    .sheet { left: 50%; right: auto; bottom: auto; top: 50%; width: 680px; max-height: 88vh; border-radius: 18px; border: 1px solid var(--line); border-top: 3px solid var(--c, var(--cyan));
      transform: translate(-50%, -46%) scale(.97); opacity: 0; pointer-events: none; transition: transform .22s, opacity .22s; }
    .sheet.on { transform: translate(-50%, -50%); opacity: 1; pointer-events: auto; }
  }
  .grab { width: 44px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .2); margin: 9px auto 0; }
  @media (min-width: 760px) { .grab { display: none; } }
  .x { position: absolute; right: 10px; top: 10px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: rgba(7, 12, 22, .7); color: var(--ink); font-size: 20px; cursor: pointer; z-index: 2; }
  .hero { display: flex; gap: 16px; padding: 16px 16px 0; }
  .hero .ph { width: 42%; max-width: 220px; flex: none; border-radius: 12px; border: 1px solid var(--line); }
  .hero .ph::after { display: none; }
  .hero .who { min-width: 0; padding-top: 4px; }
  .hero .modname { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-head); font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--c); }
  .hero .modname i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .hero .first { font-size: 15px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--ink2); margin-top: 10px; }
  .hero h3 { margin: 0; font-family: var(--font-head); font-weight: 600; font-size: clamp(26px, 8vw, 38px); line-height: 1.02; text-transform: uppercase; overflow-wrap: anywhere; }
  .hero .tag { margin-top: 10px; font-size: 17px; color: var(--ink); line-height: 1.3; }
  .legend { padding: 16px; }
  .legend h4 { margin: 0 0 8px; font-family: var(--font-head); font-weight: 500; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--ink3); }
  .legend p { margin: 0 0 10px; font-size: 18px; line-height: 1.5; color: #DCE6F2; white-space: pre-line; }
  .legend .muted { color: var(--ink3); font-size: 15px; }
  .nav2 { display: flex; gap: 10px; padding: 0 16px; }
  .nav2 button { flex: 1; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink2); cursor: pointer; font-size: 15px; }

  /* ---------- правила / лор ---------- */
  .reader { position: fixed; inset: 0; z-index: 60; background: var(--bg); overflow-y: auto; transform: translateX(100%); visibility: hidden; transition: transform .25s ease, visibility 0s .25s; }
  .reader.on { transform: none; visibility: visible; transition: transform .25s ease; }
  .r-top { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: rgba(7, 12, 22, .94); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .r-top button { height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg2); cursor: pointer; font-size: 15px; }
  .r-top b { font-family: var(--font-head); font-weight: 600; font-size: 18px; letter-spacing: 1.5px; text-transform: uppercase; flex: 1; }
  .toc { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; border-bottom: 1px solid var(--line); scrollbar-width: none; }
  .toc::-webkit-scrollbar { display: none; }
  .toc a { flex: none; color: var(--ink2); text-decoration: none; border: 1px solid var(--line); border-radius: 16px; padding: 5px 12px; font-size: 14px; }
  .md { max-width: 760px; margin: 0 auto; padding: 8px 18px calc(60px + var(--safe-b)); font-size: 18px; line-height: 1.55; color: #DCE6F2; }
  .md h1, .md h2, .md h3 { font-family: var(--font-head); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--ink); line-height: 1.15; }
  .md h1 { font-size: 28px; margin: 26px 0 10px; color: var(--cyan); }
  .md h2 { font-size: 23px; margin: 28px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .md h3 { font-size: 19px; margin: 22px 0 8px; color: var(--ink2); }
  .md p { margin: 0 0 12px; }
  .md ol, .md ul { padding-left: 24px; margin: 0 0 12px; }
  .md li { margin: 0 0 8px; }
  .md strong { color: #fff; }
  .md a { color: var(--cyan); }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Колонисты<br>Парадайза</h1>
    <div class="era">СИГМА ДРАКОНИС IV · <b>4073 С.Э.</b></div>
  </div>
  <p class="sub">Кто живёт на планете: модули, жители и то, что о них известно всем.</p>
  <div class="docs">
    <button class="doc-btn" data-doc="rules">
      <svg viewBox="0 0 24 24"><path d="M5 3h10l4 4v14H5z"/><path d="M15 3v4h4M8 11h8M8 15h8M8 19h5"/></svg>
      <div><b>Правила</b><span>как играем</span></div>
    </button>
    <button class="doc-btn" data-doc="lore">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4c3 3 3 13 0 16M12 4c-3 3-3 13 0 16"/></svg>
      <div><b>Лор</b><span>мир и история</span></div>
    </button>
  </div>
</header>

<div class="bar"><div class="bar-in">
  <label class="search" id="searchBox">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" placeholder="Найти по имени" autocomplete="off" enterkeyhint="search" aria-label="Поиск по имени">
    <button class="clear" id="qClear" aria-label="Очистить">×</button>
  </label>
  <div class="chips" id="chips"></div>
</div></div>

<main id="main">
  <div class="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
</main>

<div class="veil" id="veil"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Персонаж"></section>

<section class="reader" id="reader" aria-label="Документ">
  <div class="r-top"><button id="rBack">← Назад</button><b id="rTitle"></b></div>
  <nav class="toc" id="rToc"></nav>
  <article class="md" id="rBody"></article>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script>
(function () {
  const SUPABASE_URL = "https://yfogwbxxomuzbezgpqjm.supabase.co";
  const SUPABASE_KEY = "sb_publishable_TflOx6ZH1UM3wQPg_rEe4A_b6oxzSmd";
  const MEDIA_BUCKET = 'content-media';
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // Оформление модулей — по палитре бейджей
  const THEMES = [
    { re: /пирвел|pirvel/i, c: 'var(--m-pirveli)', sub: '4 сол. года на планете', ico: '<svg viewBox="0 0 30 34" fill="#1A0E05"><path d="M15 0c3 0 5 1.5 6 3.5-3 1-5 .5-6-3.5z"/><circle cx="7" cy="10" r="4"/><circle cx="15" cy="10" r="4"/><circle cx="23" cy="10" r="4"/><circle cx="11" cy="17" r="4"/><circle cx="19" cy="17" r="4"/><circle cx="15" cy="24" r="4"/><circle cx="15" cy="31" r="2.5"/></svg>' },
    { re: /парад|paradi/i, c: 'var(--m-paradise)', sub: 'люкс-курорт · 2,5 сол. года', ico: '<svg viewBox="0 0 32 32" fill="none" stroke="#0B1F33" stroke-width="2.6" stroke-linecap="round"><path d="M16 12c-1 5-1 9 0 14M16 12c-3-4-7-5-11-3M16 12c3-4 7-5 11-3M16 12c-4 0-7 2-9 6M16 12c4 0 7 2 9 6M16 12c0-3 1-5 3-7M6 28h20"/></svg>' },
    { re: /фридом|freedom/i, c: 'var(--m-freedom)', sub: 'спасательный · 0,5 сол. года', ico: '<svg viewBox="0 0 30 30" fill="#1A0204"><path d="M15 3 27 27h-6l-6-12-6 12H3z"/></svg>' },
    { re: /искуп|redemp/i, c: 'var(--m-redemption)', sub: 'тюремный · 6 сол. дней', ico: '<svg viewBox="0 0 30 30" fill="none" stroke="#1A1400" stroke-width="2.8"><rect x="3" y="4" width="24" height="22"/><path d="M9 4v22M15 4v22M21 4v22"/></svg>' }
  ];
  const themeOf = m => THEMES.find(t => t.re.test((m && (m.name + ' ' + (m.access_code || ''))) || '')) || { c: 'var(--cyan)', sub: '', ico: '' };

  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const photoUrl = p => !p ? '' : /^(https?:|data:)/.test(p) ? p : /^(catalog|badges)\//.test(p) ? p : sb.storage.from(MEDIA_BUCKET).getPublicUrl(p).data.publicUrl;
  const norm = s => (s || '').toLowerCase().replace(/ё/g, 'е').trim();
  const splitName = n => { const p = (n || '').trim().split(/\s+/); return p.length > 1 ? [p.slice(0, -1).join(' '), p[p.length - 1]] : ['', p[0] || '']; };

  let modules = [], chars = [], filter = 'all', query = '';

  async function load() {
    const [m, c] = await Promise.all([
      sb.from('modules').select('id,name,access_code,description,catalog_order'),
      sb.from('characters').select('id,name,photo_url,tagline,legend,home_module_id,module_access,catalog_visible,catalog_order,active')
    ]);
    if (m.error || c.error) {
      const msg = (m.error || c.error).message;
      $('main').innerHTML = `<div class="err">Не удалось загрузить каталог: ${esc(msg)}${/column|does not exist/.test(msg) ? '<br>Мастерам: выполните sql/catalog.sql в Supabase.' : ''}</div>`;
      return;
    }
    modules = (m.data || []).filter(x => x.catalog_order != null || (c.data || []).some(ch => ch.home_module_id === x.id))
      .sort((a, b) => (a.catalog_order ?? 99) - (b.catalog_order ?? 99) || (a.name || '').localeCompare(b.name || '', 'ru'));
    chars = (c.data || []).filter(x => x.catalog_visible !== false && x.active !== false)
      .map(x => ({ ...x, mod: x.home_module_id || (x.module_access || [])[0] || null }))
      .sort((a, b) => (a.catalog_order ?? 999) - (b.catalog_order ?? 999) || a.name.localeCompare(b.name, 'ru'));
    renderChips(); render(); openFromHash();
  }

  function renderChips() {
    $('chips').innerHTML = `<button class="chip all ${filter === 'all' ? 'on' : ''}" data-f="all"><span class="ci"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1"/></svg></span><span>Все</span></button>` +
      modules.map(m => { const th = themeOf(m); return `<button class="chip ${filter === m.id ? 'on' : ''}" data-f="${m.id}" style="--c:${th.c}"><span class="ci">${th.ico || ''}</span><span>${esc(m.name)}</span></button>`; }).join('');
  }

  function hl(text) {
    if (!query) return esc(text);
    const t = String(text || ''); const i = norm(t).indexOf(query);
    return i < 0 ? esc(t) : esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + query.length)) + '</mark>' + esc(t.slice(i + query.length));
  }

  function card(ch, th) {
    const [first, last] = splitName(ch.name);
    const ph = photoUrl(ch.photo_url);
    return `<button class="card" data-id="${ch.id}" style="--c:${th.c}">
      <div class="ph">${ph ? `<img src="${esc(ph)}" alt="" loading="lazy">` : `<div class="none">${esc((last || '?')[0])}</div>`}</div>
      <div class="strip"></div>
      <div class="tx"><div class="first">${hl(first)}</div><div class="last">${hl(last)}</div>${ch.tagline ? `<div class="tag">${esc(ch.tagline)}</div>` : ''}</div>
    </button>`;
  }

  function render() {
    const list = chars.filter(ch => !query || norm(ch.name).includes(query));
    const groups = [...modules.map(m => ({ m, th: themeOf(m), items: list.filter(ch => ch.mod === m.id) })),
      { m: { id: 'none', name: 'Без модуля' }, th: themeOf(null), items: list.filter(ch => !ch.mod || !modules.some(m => m.id === ch.mod)) }]
      .filter(g => g.items.length && (filter === 'all' || filter === g.m.id));
    if (!groups.length) { $('main').innerHTML = `<div class="empty">${query ? 'Никого не нашлось. Проверьте написание имени.' : 'Пока никого нет.'}</div>`; return; }
    $('main').innerHTML = groups.map(g => `
      <section class="mod" id="mod-${g.m.id}" style="--c:${g.th.c}">
        <div class="mod-head">
          <div class="mod-ico">${g.th.ico}</div>
          <div class="mod-title"><h2>${esc(g.m.name)}</h2><span>${esc(g.th.sub)}${g.th.sub ? ' · ' : ''}${g.items.length} чел.</span></div>
          ${g.m.description ? `<button class="mod-more" data-more>О модуле</button>` : ''}
        </div>
        ${g.m.description ? `<p class="mod-desc">${esc(g.m.description)}</p>` : ''}
        <div class="grid">${g.items.map(ch => card(ch, g.th)).join('')}</div>
      </section>`).join('');
  }

  /* ---------- лист персонажа ---------- */
  let current = null;
  function openChar(id, push = true) {
    const ch = chars.find(x => x.id === id); if (!ch) return;
    current = ch;
    const m = modules.find(x => x.id === ch.mod); const th = themeOf(m);
    const [first, last] = splitName(ch.name); const ph = photoUrl(ch.photo_url);
    const sameMod = chars.filter(x => x.mod === ch.mod); const i = sameMod.indexOf(ch);
    const s = $('sheet'); s.style.setProperty('--c', th.c);
    s.innerHTML = `<div class="grab"></div><button class="x" data-close aria-label="Закрыть">×</button>
      <div class="hero" style="--c:${th.c}">
        <div class="ph">${ph ? `<img src="${esc(ph)}" alt="Фото: ${esc(ch.name)}">` : `<div class="none">${esc((last || '?')[0])}</div>`}</div>
        <div class="who">
          ${m ? `<div class="modname"><i></i>${esc(m.name)}</div>` : ''}
          <div class="first">${esc(first)}</div><h3>${esc(last)}</h3>
          ${ch.tagline ? `<div class="tag">${esc(ch.tagline)}</div>` : ''}
        </div>
      </div>
      <div class="legend"><h4>Общеизвестно</h4>${ch.legend ? esc(ch.legend).split(/\n{2,}/).map(p => `<p>${p}</p>`).join('') : '<p class="muted">Легенда пока не опубликована.</p>'}</div>
      ${sameMod.length > 1 ? `<div class="nav2"><button data-nav="${sameMod[(i - 1 + sameMod.length) % sameMod.length].id}">← ${esc(splitName(sameMod[(i - 1 + sameMod.length) % sameMod.length].name)[1])}</button><button data-nav="${sameMod[(i + 1) % sameMod.length].id}">${esc(splitName(sameMod[(i + 1) % sameMod.length].name)[1])} →</button></div>` : ''}`;
    s.scrollTop = 0;
    s.classList.add('on'); $('veil').classList.add('on');
    document.body.style.overflow = 'hidden';
    if (push) history.replaceState(null, '', '#' + ch.id);
  }
  function closeChar() {
    $('sheet').classList.remove('on'); $('veil').classList.remove('on'); document.body.style.overflow = '';
    current = null; history.replaceState(null, '', location.pathname + location.search);
  }
  function openFromHash() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (h === 'rules' || h === 'lore') openDoc(h); else if (h) openChar(h, false);
  }

  // смахивание листа вниз
  (function () {
    const s = $('sheet'); let y0 = null, dy = 0;
    s.addEventListener('touchstart', e => { if (s.scrollTop <= 0) { y0 = e.touches[0].clientY; dy = 0; s.style.transition = 'none'; } }, { passive: true });
    s.addEventListener('touchmove', e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); if (window.innerWidth < 760) s.style.transform = `translateY(${dy}px)`; }, { passive: true });
    s.addEventListener('touchend', () => { if (y0 == null) return; s.style.transition = ''; s.style.transform = ''; if (dy > 110) closeChar(); y0 = null; });
  })();

  /* ---------- правила и лор ---------- */
  const DOCS = { rules: { title: 'Правила', file: 'catalog/rules.md' }, lore: { title: 'Лор', file: 'catalog/lore.md' } };
  const cache = {};
  function inline(t) {
    return esc(t.replace(/\\([-.!#*_()[\]>+])/g, '$1'))
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  function md(src) {
    const out = [], toc = []; let list = null, para = [];
    const flushP = () => { if (para.length) { out.push('<p>' + para.map(inline).join('<br>') + '</p>'); para = []; } };
    const flushL = () => { if (list) { out.push(`<${list.t}>` + list.items.map(x => '<li>' + x.map(inline).join('<br>') + '</li>').join('') + `</${list.t}>`); list = null; } };
    src.replace(/\r/g, '').split('\n').forEach(raw => {
      const line = raw.replace(/\s+$/, ''); const t = line.trim();
      let m;
      if (!t) { flushP(); return; }
      if ((m = t.match(/^(#{1,3})\s+(.*)$/))) {
        flushP(); flushL();
        const txt = m[2].replace(/\*\*/g, '').replace(/\\/g, ''); const id = 's' + toc.length;
        if (m[1].length <= 2) toc.push({ id, txt });
        out.push(`<h${m[1].length} id="${id}">${esc(txt)}</h${m[1].length}>`); return;
      }
      if ((m = t.match(/^(\d+)[.)]\s+(.*)$/)) || (m = t.match(/^[-*•]\s+(.*)$/))) {
        flushP(); const ordered = /^\d/.test(t); const txt = ordered ? m[2] : m[1];
        if (!list || list.t !== (ordered ? 'ol' : 'ul')) { flushL(); list = { t: ordered ? 'ol' : 'ul', items: [] }; }
        list.items.push([txt]); return;
      }
      if (/^\\-\s/.test(t)) { flushP(); if (!list || list.t !== 'ul') { flushL(); list = { t: 'ul', items: [] }; } list.items.push([t.slice(2).trim()]); return; }
      if (list && /^\s/.test(raw)) { list.items[list.items.length - 1].push(t); return; }
      flushL(); para.push(t);
    });
    flushP(); flushL();
    return { html: out.join('\n'), toc };
  }
  async function openDoc(key) {
    const d = DOCS[key]; if (!d) return;
    if (current) closeChar();
    $('rTitle').textContent = d.title; $('rBody').innerHTML = '<p>Загрузка…</p>'; $('rToc').innerHTML = '';
    $('reader').classList.add('on'); $('reader').scrollTop = 0; document.body.style.overflow = 'hidden';
    history.replaceState(null, '', '#' + key);
    try {
      cache[key] = cache[key] || await fetch(d.file, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); });
      const r = md(cache[key]);
      $('rBody').innerHTML = r.html;
      $('rToc').innerHTML = r.toc.map(x => `<a href="#" data-to="${x.id}">${esc(x.txt)}</a>`).join('');
      $('rToc').style.display = r.toc.length > 1 ? '' : 'none';
    } catch (e) { $('rBody').innerHTML = '<p>Не удалось загрузить документ.</p>'; }
  }
  function closeDoc() { $('reader').classList.remove('on'); document.body.style.overflow = ''; history.replaceState(null, '', location.pathname + location.search); }

  /* ---------- события ---------- */
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-id],[data-f],[data-more],[data-close],[data-nav],[data-doc],[data-to],#veil,#rBack,#qClear');
    if (!t) return;
    if (t.dataset.id) openChar(t.dataset.id);
    else if (t.dataset.nav) openChar(t.dataset.nav);
    else if (t.dataset.f) { filter = t.dataset.f; renderChips(); render(); window.scrollTo({ top: document.querySelector('.bar').offsetTop, behavior: 'smooth' }); }
    else if (t.hasAttribute('data-more')) t.closest('.mod').classList.toggle('open');
    else if (t.hasAttribute('data-close') || t.id === 'veil') closeChar();
    else if (t.dataset.doc) openDoc(t.dataset.doc);
    else if (t.id === 'rBack') closeDoc();
    else if (t.dataset.to) { e.preventDefault(); const el = document.getElementById(t.dataset.to); $('reader').scrollTo({ top: el.offsetTop - 110, behavior: 'smooth' }); }
    else if (t.id === 'qClear') { e.preventDefault(); $('q').value = ''; onQuery(); $('q').focus(); }
  });
  function onQuery() { query = norm($('q').value); $('searchBox').classList.toggle('has', !!query); render(); }
  $('q').addEventListener('input', onQuery);
  $('q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.target.blur(); const one = chars.filter(ch => norm(ch.name).includes(query)); if (one.length === 1) openChar(one[0].id); } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('reader').classList.contains('on')) closeDoc(); else if (current) closeChar(); } });
  window.addEventListener('hashchange', openFromHash);

  load();
})();
</script>
</body>
</html>
